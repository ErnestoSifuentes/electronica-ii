<g class="x s"><text x="70" y="287">−250</text><text x="256" y="287">−100</text><text x="380" y="287">0</text><text x="504" y="287">+100</text><text x="690" y="287">+250</text></g>
<text x="380" y="310" class="x">Voltaje diferencial efectivo (µV)</text>
<text x="112" y="240" class="s">Saturación baja</text><text x="549" y="58" class="s">Saturación alta</text>
<text x="270" y="124" class="s">Tramo lineal</text>
